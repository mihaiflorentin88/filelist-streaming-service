name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests, vet, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Mirrors the Makefile `build` comment: the cgo GUI packages (internal/gui
      # via wails3) need gtk3/webkit2gtk-4.1 headers to compile on linux. This
      # step is CI-only — it fails on a macOS host, where WebKit/GTK come from
      # the system/Xcode SDKs instead.
      - name: Install WebKit/GTK dev packages (GUI cgo)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # wails3 (v3.0.0-beta.16, matches go.mod github.com/wailsapp/wails/v3)
      # drives `make build` (icons + wails3 build task); Makefile WAILS3 var.
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
      - name: Unit tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: make build

  clients:
    name: Browser and Tizen clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Client unit tests
        run: npm run test:clients
      # Desktop GUI suite (vitest, @filelist/desktop workspace).
      - name: Desktop unit tests
        run: npm run test -w @filelist/desktop
      - name: Test and build browser and TV clients
        run: npm run build
      - name: Package and validate unsigned Apps2Samsung WGT
        run: make tizen-wgt validate-tizen-wgt
      - name: Validate the same WGT against the Tizen 5.0 support floor
        run: make validate-tizen-wgt TIZEN_TARGET=5.0
      - name: Headless old-engine boot smoke on the pinned Chrome 63 floor
        run: make smoke-tizen-engine
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tizen-wgt-ci
          path: clients/tizen/.build/artifacts/*.wgt
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Packaging and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packaging tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Repository whitespace checks
        run: git diff --check
