name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go tests, vet, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build server
        run: make build

  clients:
    name: Browser and Tizen clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test and build browser and TV clients
        run: npm run build
      - name: Package and validate unsigned Apps2Samsung WGT
        run: make tizen-wgt validate-tizen-wgt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tizen-wgt-ci
          path: clients/tizen/.build/artifacts/*.wgt
          if-no-files-found: error
          retention-days: 7

  tooling:
    name: Packaging and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packaging tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Repository whitespace checks
        run: git diff --check
