name: Release build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clients:
    name: Client release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify declared versions
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "$(node -p "require('./clients/tizen/package.json').version")"
          python3 - "$version" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          actual = ET.parse('clients/tizen/config.xml').getroot().attrib['version']
          if actual != sys.argv[1]:
              raise SystemExit(f'Tizen manifest version {actual} != VERSION {sys.argv[1]}')
          PY
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi
      - run: npm ci
      - name: Test and build clients
        run: npm run build
      - name: Package and validate TV application
        run: make tizen-wgt validate-tizen-wgt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-static
          path: internal/adapters/httpapi/static/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tizen
          path: clients/tizen/.build/artifacts/*.wgt
          if-no-files-found: error
          retention-days: 14

  servers:
    name: Server ${{ matrix.target }}
    needs: clients
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            suffix: ''
            format: tar
          - target: linux-arm64
            goos: linux
            goarch: arm64
            suffix: ''
            format: tar
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            suffix: ''
            format: tar
          - target: windows-amd64
            goos: windows
            goarch: amd64
            suffix: .exe
            format: zip
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            suffix: ''
            format: tar
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            suffix: ''
            format: tar
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-static
          path: internal/adapters/httpapi/static
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p staging
          go build -trimpath -ldflags="-s -w -X github.com/mihaiflorentin88/filelist-streaming-service/internal/composition.Version=${version}" -o "staging/filelist-streaming${BINARY_SUFFIX}" ./cmd/server
          cp README.md staging/
      - name: Create archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          ARCHIVE_FORMAT: ${{ matrix.format }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          base="filelist-streaming-${version}-${RELEASE_TARGET}"
          if [[ "${ARCHIVE_FORMAT}" == "zip" ]]; then
            (cd staging && zip -9 "../${base}.zip" ./*)
          else
            tar -C staging -czf "${base}.tar.gz" .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: filelist-streaming-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [clients, servers]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release and upload its assets.
      id-token: write # Request the OIDC identity used for provenance.
      attestations: write # Persist build provenance attestations.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate CycloneDX SBOMs
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod app -json -licenses -main cmd/server -output release/sbom-go.cdx.json .
          npm ci
          npm exec --yes --package=@cyclonedx/cyclonedx-npm@4.1.1 -- cyclonedx-npm --output-file release/sbom-npm.cdx.json --output-format JSON --omit dev
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          format: spdx-json
          output-file: release/sbom-release.spdx.json
          upload-artifact: false
      - name: Checksums
        run: (cd release && sha256sum ./* > SHA256SUMS)
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes --title "FileList Streaming ${GITHUB_REF_NAME}"
